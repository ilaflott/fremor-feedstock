schema_version: 1

context:
  python_min: "3.11"
  version: "0.9.8"

package:
  name: fremor
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/f/fremor/fremor-${{ version }}.tar.gz
  sha256: 27b3cc8d720b1587b757d4d08f37ecdfafe15de93aae844080a7b5f93923cdaa

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - fremor = fremor.cli:fremor

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - click
    - cmor
    - netcdf4
    - numpy
    - pyyaml

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - fremor
      pip_check: true
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - fremor --help
      - fremor --version

about:
  summary: Model output rewriter (CMORizer) for FRE/FMS based models
  license: Apache-2.0
  license_file: LICENSE.md
  homepage: https://pypi.org/project/fremor/

extra:
  recipe-maintainers:
    - ilaflott
    - fmalatino
